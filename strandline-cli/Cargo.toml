[package]
name = "strandline-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Satellite-derived shoreline extraction and analysis engine (CLI)"

[[bin]]
name = "strandline"
path = "src/main.rs"

[features]
default = ["cloud"]
# Adquisición cloud-native (STAC/COG streaming desde Planetary Computer).
# Desactivable para un binario mínimo sin stack HTTP.
cloud = ["dep:surtgis-cloud", "dep:surtgis-core"]

[dependencies]
strandline-core = { path = "../strandline-core" }
surtgis-cloud = { workspace = true, optional = true }
surtgis-core = { workspace = true, optional = true }
ndarray.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
