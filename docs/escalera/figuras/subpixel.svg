t x="436" y="157" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">contorno subpíxel</text><text x="410" y="200" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">Entre +0,3 y −0,1 el 0,1 queda</text><text x="410" y="218" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">a la mitad: (0,3 − 0,1) / (0,3 + 0,1)</text><text x="410" y="236" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">= 0,5 del camino entre centros.</text><text x="410" y="270" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">Cada número es el valor en el centro</text><text x="410" y="288" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">del píxel (punto). La línea pasa entre</text><text x="410" y="306" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">centros, no por los bordes de los píxeles.</text></svg>
