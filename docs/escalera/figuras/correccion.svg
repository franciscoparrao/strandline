<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14"><rect width="680" height="345" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><path d="M40,300 L640,90 L640,330 L40,330 Z" fill="#f3e3bf" stroke="#8a7a55"/><path d="M40,160 L440.0,160 L40,300 Z" fill="#cfe3f3" fill-opacity="0.85"/><line x1="40" y1="230" x2="640" y2="230" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><text x="560" y="222" text-anchor="end" fill="#0f766e" font-size="13" font-weight="bold">nivel de referencia z_ref</text><line x1="40" y1="160" x2="640" y2="160" stroke="#1d4ed8" stroke-width="2"/><text x="560" y="152" text-anchor="end" fill="#1d4ed8" font-size="13" font-weight="bold">nivel del agua η (marea alta)</text><circle cx="240" cy="230" r="6" fill="#0f766e"/><circle cx="440" cy="160" r="6" fill="#1d4ed8"/><line x1="240" y1="270" x2="440" y2="270" stroke="#c2410c" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="340.0" y="292" text-anchor="middle" fill="#c2410c" font-size="15" font-weight="bold">Δx = (η − z_ref) / tan β</text><text x="60" y="320" text-anchor="start" fill="#7c5a16" font-size="13" font-weight="bold">playa con pendiente tan β</text><text x="40" y="30" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">Con marea alta la orilla aparece más tierra adentro. La corrección la devuelve al nivel de referencia.</text><text x="40" y="48" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">Mientras más plana la playa (tan β chico), más grande es Δx para la misma subida del agua.</text></svg>
