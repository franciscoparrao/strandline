<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14"><rect width="640" height="340" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect x="0" y="0" width="640" height="360" fill="#f3e3bf"/><path d="M0,0 L640,0 L640,110 L0,110 Z" fill="#cfe3f3"/><line x1="0" y1="110" x2="640" y2="110" stroke="#0f766e" stroke-width="3"/><text x="10" y="100" text-anchor="start" fill="#0f766e" font-size="13" font-weight="bold">costa antes</text><line x1="0" y1="230" x2="640" y2="230" stroke="#c2410c" stroke-width="3"/><text x="10" y="250" text-anchor="start" fill="#c2410c" font-size="13" font-weight="bold">costa después (retrocedió Δ)</text><line x1="200" y1="110" x2="200" y2="230" stroke="#1d4ed8" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="150" y="175" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="bold">Δ</text><line x1="330" y1="110" x2="430.7" y2="230" stroke="#1f2933" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="330" y1="110" x2="330" y2="230" stroke="#1f2933" stroke-width="1" stroke-dasharray="5 4"/><path d="M330,150 A40,40 0 0,0 355.7,140.6" fill="none" stroke="#1f2933"/><text x="345" y="175" text-anchor="start" fill="#1f2933" font-size="18" font-weight="bold">θ</text><text x="440.6919557412736" y="200" text-anchor="start" fill="#1f2933" font-size="15" font-weight="bold">medido = Δ / cos θ</text><text x="440.6919557412736" y="220" text-anchor="start" fill="#1f2933" font-size="13" font-weight="normal">con θ = 40°: 1,31 Δ</text><text x="320" y="300" text-anchor="middle" fill="#1f2933" font-size="13" font-weight="normal">transecto oblicuo: mide un tramo más largo que el retroceso real</text><text x="320" y="320" text-anchor="middle" fill="#1f2933" font-size="13" font-weight="normal">y nunca uno más corto, porque cos θ ≤ 1.</text></svg>
