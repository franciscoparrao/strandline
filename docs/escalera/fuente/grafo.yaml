# Grafo de prerrequisitos (diseño inverso) del manuscrito de strandline
# (Computers & Geosciences, borrador). Cima: lo que el paper sostiene haber
# mostrado. Cada concepto declara su nivel y lo que necesita saber antes.
afirmaciones:
  - id: a1
    corto: "Copia fiel de CoastSat"
    texto: "strandline reproduce el método de CoastSat etapa por etapa: la clasificación coincide a menos de 1,5 % en píxeles, la línea de costa a una mediana de 0,2 m en las mismas escenas, la marea sintetizada a 1,15 mm de pyTMD, y los transectos, las tasas y el control de calidad a nivel de redondeo."
    ref: "Resumen, p. 2-3; Sec. 2.2-2.6, p. 8-12; Sec. 5.1, p. 20"
    requiere: [c-strandline, c-equivalencia, c-coastsat, c-correccion-mareal, c-control-calidad, c-divergencias]
  - id: a2
    corto: "Mucho más rápido, sin dependencias"
    texto: "La intersección de transectos corre unas 280 veces más rápido que la referencia vectorizada en Python sobre el mismo cálculo (37 veces con un solo hilo), con salidas paralela y secuencial idénticas bit a bit, y el motor se instala como un solo binario, sin la cadena de dependencias de la marea."
    ref: "Sec. 5.2 y Tabla 2, p. 20-21; Sec. 2.4, p. 9-10"
    requiere: [c-strandline, c-razon-intercalada, c-paralelo-determinista, c-interseccion, c-constituyentes]
  - id: a3
    corto: "Extraer y medir son distintos"
    texto: "En imágenes SR contra transectos anclados al mar, refinar la línea de costa sobre normales locales da el menor error mediano (12,5 frente a 16,0 m sin refinar en los sitios complejos); ajustar un perfil sobre los transectos fijos mejora menos y solo empeora donde están desalineados (Constitución). Los autores lo leen como evidencia, indirecta, de que la geometría para extraer y la geometría para medir son decisiones separadas y que solo la segunda debe ser fija."
    ref: "Sec. 5.4 y Tabla 3, p. 22-25"
    requiere: [c-geom-extraccion-medicion, c-ajuste-perfil, c-referencia-desviada]
  - id: a4
    corto: "Transectos limpios ~6°; desviados fingen 40°"
    texto: "Medido contra una nula sobre transectos anclados a la costa oceánica, el ángulo persistente entre los transectos fijos y la normal local es chico (mediana 5,7°, inflación de tasa de 0,5 %), salvo en la desembocadura del Maule (22°, inflación de 8 % como máximo); sobre transectos cuya referencia se desvió tierra adentro, la misma medición da un falso 39,9° que pasa las pruebas de coherencia espacial y temporal."
    ref: "Sec. 5.5, p. 24-28; Tabla 4, p. 27; Fig. 3, p. 31"
    requiere: [c-angulo-persistente, c-supuesto-local, c-permutacion, c-referencia-desviada]
  - id: a5
    corto: "Precisión por sensor depende del sitio"
    texto: "Las diferencias de precisión entre sensores son chicas, cambian de orden entre sitios y son menores que las que supone la tabla fija de pesos del estudio de referencia; por eso los pesos deben calibrarse y validarse por sitio y no aplicarse a ciegas."
    ref: "Sec. 5.6 y Tabla 5, p. 32-33"
    requiere: [c-pesos-sensor, c-referencia-desviada]
  - id: a6
    corto: "Límite: clasificador solo TOA"
    texto: "El clasificador de CoastSat está entrenado con reflectancia en el techo de la atmósfera y no se transfiere a reflectancia de superficie; con esos productos el motor usa un umbral de Otsu refinado sin clasificador, y un clasificador reentrenado queda como trabajo futuro."
    ref: "Sec. 7, p. 36"
    requiere: [c-clasificador, c-toa-sr]

