[workspace]
resolver = "2"
members = ["strandline-core", "strandline-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Francisco Parra O."]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
surtgis-core = { path = "../surtgis/crates/core" }
surtgis-cloud = { path = "../surtgis/crates/cloud", features = ["native"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
# Debe coincidir con la versión que usa surtgis-core (0.16) para que los
# tipos de `Raster::data()` (ndarray::Array2) sean compatibles: surtgis-core
# dejó de re-exportar `ndarray`, así que se declara como dep directa.
ndarray = "0.16"
# STL (Cleveland et al. 1990) para descomposición estacional de series de
# shoreline — ver strandline-core::stl. MIT/Unlicense.
stlrs = "0.4"

[profile.release]
lto = true
