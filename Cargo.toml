[workspace]
resolver = "2"
members = ["strandline-core", "strandline-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Francisco Parra O."]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
surtgis-core = { path = "../surtgis/crates/core" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.release]
lto = true
